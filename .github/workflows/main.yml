name: MYBUZZ News Bot

on:
  workflow_dispatch:

jobs:
  news-bot:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # SETUP PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip


      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ============================================================
      # RUN MYBUZZ NEWS BOT
      # ============================================================

      - name: Run MYBUZZ News Bot
        env:
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |

          echo "======================================"
          echo "MYBUZZ NEWS BOT START"
          echo "======================================"

          echo "Checking API configuration..."

          if [ -z "$GNEWS_API_KEY" ]; then
            echo "ERROR: GNEWS_API_KEY is missing."
            exit 1
          fi

          if [ -z "$OPENAI_API_KEY" ]; then
            echo "ERROR: OPENAI_API_KEY is missing."
            exit 1
          fi

          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "ERROR: TELEGRAM_BOT_TOKEN is missing."
            exit 1
          fi

          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "ERROR: TELEGRAM_CHAT_ID is missing."
            exit 1
          fi

          echo "API configuration OK."

          python mybuzz_news_bot.py

          echo "======================================"
          echo "MYBUZZ NEWS BOT FINISHED"
          echo "======================================"


      # ============================================================
      # SAVE DUPLICATE HISTORY
      # ============================================================

      - name: Save duplicate history
        if: always()
        run: |

          echo "======================================"
          echo "SAVE DUPLICATE HISTORY"
          echo "======================================"

          if [ -f posted.json ]; then

            echo "posted.json found."

            git config user.name "MYBUZZ News Bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add posted.json

            if git diff --cached --quiet; then

              echo "No duplicate history changes."

            else

              git commit -m "Update MYBUZZ duplicate history"

              git push

              echo "Duplicate history saved."

            fi

          else

            echo "No posted.json found."

          fi

          echo "======================================"


      # ============================================================
      # NOTIFY CLOUDFLARE WORKER
      # ============================================================

      - name: Notify Cloudflare Worker
        if: always()
        env:
          CLOUDFLARE_WORKER_URL: ${{ secrets.CLOUDFLARE_WORKER_URL }}

        run: |

          echo "======================================"
          echo "NOTIFY CLOUDFLARE WORKER"
          echo "======================================"

          if [ -z "$CLOUDFLARE_WORKER_URL" ]; then
            echo "WARNING: CLOUDFLARE_WORKER_URL is missing. Skipping notification."
            exit 0
          fi

          if [ "${{ job.status }}" == "success" ]; then
            STATUS="success"
          else
            STATUS="failed"
          fi

          echo "Job status: $STATUS"

          curl -X POST "$CLOUDFLARE_WORKER_URL" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"$STATUS\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"workflow\":\"main.yml\"}" \
            --connect-timeout 10 \
            --max-time 30 \
            || echo "WARNING: Failed to notify Cloudflare Worker"

          echo "======================================"
