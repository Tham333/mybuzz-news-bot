name: MYBUZZ News Bot

on:
  schedule:
    # 每天 UTC 01:30 运行
    # = 马来西亚时间 09:30
    - cron: "30 1 * * *"

  workflow_dispatch:

jobs:
  news-bot:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run MYBUZZ News Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-20b
          MAX_NEWS: 5
          MAX_AGE_HOURS: 24
        run: |
          python mybuzz_news_bot.py

      - name: Save posted news state
        if: always()
        run: |
          if [ -f posted.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add posted.json

            if ! git diff --cached --quiet; then
              git commit -m "Update posted news state"
              git push
            else
              echo "No posted.json changes to commit."
            fi
          else
            echo "posted.json does not exist."
          fi
